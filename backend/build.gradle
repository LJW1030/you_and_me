plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}
group = 'kr.doran'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'com.google.firebase:firebase-admin:9.11.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') { useJUnitPlatform() }
dependencies { implementation 'org.springframework.security:spring-security-messaging' }
dependencies { implementation 'org.springframework.session:spring-session-jdbc' }

// Start Mockito's agent with the test JVM; CI environments may disallow self-attachment.
configurations { mockitoAgent }
dependencies { mockitoAgent('org.mockito:mockito-core') { transitive = false } }
tasks.named('test') { jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}" }
