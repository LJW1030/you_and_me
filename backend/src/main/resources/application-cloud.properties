spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.error.include-message=never
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
# Avoid database wakeups every minute while the service is otherwise idle.
spring.session.jdbc.cleanup-cron=0 0 0 * * *
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200
server.tomcat.accept-count=30
server.tomcat.max-http-form-post-size=16KB
