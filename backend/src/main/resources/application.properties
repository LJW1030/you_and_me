spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/doran}
spring.datasource.username=${DB_USER:doran}
spring.datasource.password=${DB_PASSWORD:doran_local}
mybatis.mapper-locations=classpath:mapper.xml
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=always

spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
server.servlet.session.cookie.max-age=7d
