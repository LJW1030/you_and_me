services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: doran
      POSTGRES_USER: doran
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doran_local}
    ports: ["${DB_PORT:-15432}:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doran"]
      interval: 3s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/doran
      DB_PASSWORD: ${DB_PASSWORD:-doran_local}
    ports: ["8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  db:
